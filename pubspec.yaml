name: munchkin_companion
description: "Munchkin Offline Companion — LAN level counter, rules browser, and table coordinator."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shelf: ^1.4.3
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  uuid: ^4.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  file_picker: ^13.2.0
  wakelock_plus: ^1.8.2
  logging: ^1.3.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  build_runner: ^2.16.2
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/rules/v1/
